<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>window.QUIZ_EMBED=true</script><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>חידון י"ט כסלו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* פריסה: מסך אחד של ספרייה בלילה - שאלה למעלה, ספרים כרוכים בתור תשובות, סרגל משחק למטה */
:root{
  color-scheme:dark;
  --night:#1c0f20; --ink:#fffaf0; --gold:#f0cf8a; --soft:#d6c3cf;
  --ok:#57d98a; --bad:#ff7d74; --panel:rgba(24,10,28,.86); --dark:#2b1430;
  --display:"Frank Ruhl Libre","FrankRuehl","David",serif;
  --ui:"Assistant","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%;direction:rtl;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{height:100%;max-width:1280px;margin:0 auto}
/* פתיחה */
#home{overflow:auto;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;padding-block:4vh}
#home h1{font:900 clamp(3rem,9vw,6.4rem)/1 var(--display);margin:0;text-shadow:0 4px 18px #000}
#home .sub{font:500 clamp(1.3rem,3vw,2rem)/1.2 var(--display);color:var(--gold);margin:0}
#home p{margin:0;max-width:56ch;font-size:1.1rem;line-height:1.55;color:var(--soft)}
#home .sub + p{background:var(--panel);border-radius:10px;padding:12px 20px}
.modes{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.big{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:16px 24px;width:min(300px,100%);font-size:1.02rem;color:var(--soft)}
.big b{display:block;font:700 1.6rem/1.25 var(--display);color:var(--ink)}
.big:hover,.chip:hover{background:#52304d}
.classes{background:var(--panel);border-radius:10px;padding:12px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:9px 16px;font-weight:700;font-size:1.1rem}
input{font:700 1.1rem var(--ui);color:var(--ink);background:rgba(0,0,0,.45);border:1px solid var(--gold);border-radius:8px;padding:9px 12px;width:170px;max-width:100%;text-align:center}
/* משחק */
#game{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.teams{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.team{font-size:.98rem;padding:3px 10px;border-radius:7px;background:rgba(0,0,0,.4);color:var(--soft)}
.team.on{background:var(--gold);color:var(--dark)}
.tag{background:var(--gold);color:var(--dark);border-radius:7px;padding:2px 12px;font-size:1.05rem}
#q{font:700 clamp(1.5rem,4.1vw,3.3rem)/1.18 var(--display);text-align:center;text-wrap:balance;margin:0;text-shadow:0 3px 10px #000,0 0 3px #000;padding-block:4px 8px}
#q.long{font-size:clamp(1.2rem,2.7vw,2.1rem)}
#books{display:flex;gap:clamp(12px,2.4vw,34px);justify-content:center;align-items:stretch;min-height:0}
.book{position:relative;flex:1 1 0;min-width:0;max-width:300px;max-height:470px;margin-block:auto;height:100%;border-radius:5px 12px 4px 4px;
  background:linear-gradient(100deg,rgba(255,255,255,.2),rgba(255,255,255,0) 30%,rgba(0,0,0,.28)),var(--c);
  box-shadow:inset 0 -18px 0 -2px #d9cdbb,inset 0 -21px 0 -2px rgba(0,0,0,.4),inset 14px 0 12px -8px rgba(0,0,0,.55),0 12px 24px rgba(0,0,0,.55);
  transition:transform .18s,opacity .4s,filter .4s}
.book::before{content:"";position:absolute;inset:14px 14px 32px 26px;border:2px solid rgba(240,207,138,.75);outline:1px solid rgba(240,207,138,.45);outline-offset:-7px;border-radius:3px;pointer-events:none}
.book svg{position:absolute;width:30px;height:30px;fill:none;stroke:#f0cf8a;stroke-width:2.2;opacity:.9;pointer-events:none}
.book .cr{top:26px;left:38px}
.book .cl{top:26px;right:26px;transform:scaleX(-1)}
.book .flame{bottom:46px;left:calc(50% - 9px)}
.lbl{position:absolute;inset:52px 28px 80px 40px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  font:700 2.2rem/1.16 var(--display);text-shadow:0 2px 5px rgba(0,0,0,.85)}
.book:not(:disabled):hover{transform:translateY(-8px)}
.book:disabled{cursor:default;color:inherit}
.book.dim{opacity:.24;filter:saturate(.5)}
.book.good{transform:scale(1.03);box-shadow:inset 0 -18px 0 -2px #d9cdbb,0 0 0 5px var(--ok),0 0 38px var(--ok)}
.book.wrong{box-shadow:inset 0 -18px 0 -2px #d9cdbb,0 0 0 5px var(--bad)}
.mark{position:absolute;bottom:24px;right:10px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:900 2.1rem/1 var(--ui);background:var(--ok);color:#06301a}
.wrong .mark{background:var(--bad);color:#3d0703}
#fact{min-height:74px;display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}
#fact .txt{background:var(--panel);border-radius:10px;padding:9px 18px;font-size:clamp(1rem,1.7vw,1.22rem);line-height:1.4;max-width:75ch;min-width:0}
#fact b.ok{color:var(--ok)}
#fact b.no{color:var(--bad)}
.next{background:var(--gold);color:var(--dark);font-weight:700;font-size:1.2rem;border-radius:9px;padding:11px 24px;white-space:nowrap}
.next:hover{background:#ffe3a8}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ic:hover{background:rgba(255,255,255,.16)}
.ic:disabled{opacity:.3;cursor:default}
.ic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grp{display:flex;align-items:center;gap:4px}
.chip.on{background:var(--gold);color:var(--dark)}
a.chip{text-decoration:none;color:var(--ink)}
#songs .chip{font-size:1rem;padding:7px 13px}
#dock{position:fixed;left:14px;bottom:70px;width:232px;height:204px;z-index:5;border:2px solid var(--gold);border-radius:8px;overflow:hidden;background:#000}
#dock iframe{display:block;width:100%;height:100%;border:0}
@media(min-width:901px){.yt #app{padding-left:262px}}
@media(max-width:900px){#dock{left:50%;transform:translateX(-50%);bottom:64px;height:200px}.yt #app{padding-bottom:210px}}
/* סיום */
#end{overflow:auto;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:3vh}
#end h2{font:900 clamp(2.6rem,7vw,4.6rem)/1.05 var(--display);margin:0;text-shadow:0 3px 14px #000}
.res{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;font-size:1.1rem;color:var(--soft)}
.res b{display:block;font:700 2.6rem/1.1 var(--display);color:var(--ink);direction:ltr}
table{border-collapse:collapse;background:var(--panel);border-radius:10px;font-size:1.1rem}
td,th{padding:8px 18px;border-bottom:1px solid rgba(240,207,138,.2)}
th{color:var(--gold)}
#rev{list-style:none;margin:0;padding:0;width:100%;max-width:860px;text-align:right;display:grid;gap:8px}
#rev li{background:var(--panel);border-radius:9px;padding:11px 16px;line-height:1.45}
#rev .a{color:var(--ok);font-weight:700}
#rev .y{color:var(--bad)}
@media(max-width:700px){
  #books{flex-direction:column;gap:10px;overflow:auto;justify-content:flex-start;padding:6px}
  .book{flex:1 0 80px;max-width:none;max-height:130px;width:100%;margin-block:0;height:auto}
  .book .cr,.book .cl,.book .flame{display:none}
  .book::before{inset:7px 8px 22px 18px;outline:0}
  .lbl{inset:8px 14px 24px 24px}
  .mark{width:36px;height:36px;font-size:1.4rem;bottom:22px;right:4px}
  #fact{flex-direction:column;gap:8px;min-height:0}
  .next{width:100%}
}
@media(min-width:701px) and (max-height:560px){
  .book .cr,.book .cl,.book .flame{display:none}
  .book::before{inset:8px 10px 24px 22px;outline:0}
  .lbl{inset:14px 18px 30px 30px}
  #q,#q.long{font-size:1.35rem;padding-block:0}
  #game{gap:4px}
  #fact{min-height:56px}
  #fact .txt{font-size:.95rem;padding:5px 12px}
  .mark{width:38px;height:38px;font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){.book{transition:none}}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <main class="screen" id="home">
    <h1>י"ט כסלו</h1>
    <p class="sub">ראש השנה לחסידות</p>
    <p>שאלות על סיפור המאסר והגאולה של אדמו"ר הזקן. כל תשובה נכונה מזכה את הכיתה בחלק מהסיפור. כיתה שטעתה ממתינה לתור הבא שלה. הכיתה שאוספת הכי הרבה חלקים מנצחת.</p>
    <div class="modes">
      <button class="big" id="mTeams"><b>תחרות כיתות</b>שתי כיתות לסירוגין, 25 שאלות לכל אחת</button>
      <button class="big" id="mAll"><b>חידון מלא</b>כל 50 השאלות ברצף</button>
    </div>
    <div class="classes" id="songBox"><span id="songTitle"></span><div class="row" id="songs"></div></div>
    <div class="classes"><span>שמות הכיתות (אפשר לשנות):</span>
      <div class="row"><input id="n0" aria-label="שם הכיתה הראשונה" maxlength="18" value="כיתה א'"><input id="n1" aria-label="שם הכיתה השנייה" maxlength="18" value="כיתה ב'"></div>
      <span>או 25 שאלות לכיתה אחת:</span><div class="row" id="pick"></div></div>
  </main>
  <main class="screen" id="game" hidden>
    <div class="bar"><span id="score"></span><div class="teams" id="teams"></div><span id="time" dir="ltr"></span></div>
    <h2 id="q" aria-live="polite"></h2>
    <div id="books"></div>
    <div id="fact" aria-live="polite"></div>
    <div class="bar">
      <button class="ic" id="bHome" aria-label="חזרה לפתיחה" title="חזרה לפתיחה"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v10h14V10"/></svg></button>
      <div class="grp"><button class="ic" id="bPrev" aria-label="לשאלה הקודמת"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button><span id="pos"></span><button class="ic" id="bNext" aria-label="לשאלה הבאה"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button></div>
      <div class="grp"><button class="ic" id="bMus" aria-label="מנגינת רקע" title="מנגינת רקע"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="x" d="" /></svg></button><button class="ic" id="bSnd" aria-label="צליל" title="צליל"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6"/></svg></button><button class="ic" id="bFull" aria-label="מסך מלא" title="מסך מלא"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    </div>
  </main>
  <main class="screen" id="end" hidden></main>
</div>
<aside id="dock" hidden aria-label="נגן יוטיוב"><div id="player"></div></aside>
<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';
// [שאלה, תשובה נכונה, [מסיחים], הסבר] - לפי סדר המצגת, שתי כיתות לסירוגין
const Q=[
[`מה שמו של האדמו"ר הזקן?`,`ר' שניאור זלמן`,[`ר' דובער`,`ר' זלמן חיים`],`רבי שניאור זלמן מליאדי, מייסד חסידות חב"ד.`],
[`למי היה האדמו"ר הזקן תורם צדקה בעיקר?`,`לעניי ארץ ישראל`,[`לעניי פטרבורג`,`לבניית בתי כנסת ברוסיה`],`הוא שלח כסף ליהודים בארץ ישראל, שהיו אז במצב כלכלי קשה.`],
[`כתב ההלשנה דיווח על עזרה ל:`,`תורכיה, האויבת של רוסיה`,[`פולין`,`אנגליה`],`ארץ ישראל הייתה בשלטון התורכים, ולכן העלילו שהכסף נשלח לאויב.`],
[`מתי באו לאסור את הרבי בפעם הראשונה ובפעם השנייה?`,`הראשונה בחג הסוכות, השנייה באסרו חג`,[`הראשונה בין יום כיפור לסוכות, השנייה בחנוכה`,`הראשונה בשמחת תורה, השנייה בר"ח כסלו`,`הראשונה בערב ראש השנה, השנייה במוצאי יום כיפור`],`באסרו חג סוכות, בליל שישי, לקחו את הרבי לפטרבורג.`],
[`מה הייתה תשובתו של ר' שמואל מונקס לרבי על התייעצותו אם לברוח או לא?`,`אם אתה רבי - אין לך ממה לפחד. ואם לא - מגיע לך!`,[`ברח מיד לארץ ישראל`,`הסתתר עד אחרי חנוכה`],`הרבי הניח את ראשו על ידו, חשב זמן מה, והחליט לא לברוח.`],
[`בעת מאסרו שלח הרבי כמה חסידים לשליחויות שונות. להיכן, ומה הייתה השליחות?`,`לברדיטשוב - למסור פדיון נפש, ולווילנא - לדאוג שהתרגום יהיה מדויק`,[`למעזריטש - להביא ספרים, ולליאדי - להביא אוכל`,`לארץ ישראל - להתפלל בכותל, ולוורשה - לאסוף כסף`],`הפדיון נפש נמסר לר' לוי יצחק מברדיטשוב. בווילנא תרגמו לרוסית את תשובות הרבי לחוקרים.`],
[`באיזו מרכבה לקחו את אדמו"ר הזקן למאסר?`,`שחורה, של מורדים במלכות`,[`גדולה`,`לבנה, של אנשי הקיסר`],`זו הייתה מרכבה שחורה מיוחדת, שיועדה למורדים במלכות.`],
[`אילו ניסים עשה ה' בנסיעה כדי שאדמו"ר הזקן לא יחלל שבת?`,`נשבר ציר העגלה, ואחר כך מת הסוס`,[`ירד שלג כבד שחסם את הדרך`,`השוטרים נרדמו והעגלה חזרה לאחור`],`החייל הבין שמשמיים עוזרים לרבי, ועצר בצד הדרך לכל השבת, ליד העיר נעוועל.`],
[`אדמו"ר הזקן: "תעצור את הסירה כדי שאוכל לקדש לבנה". הפקיד: "מה תיתן לי בתמורה?" מה נתן לו אדמו"ר הזקן?`,`ברכה בכתב יד קדשו`,[`מטבע זהב`,`ספר תניא`],`הפקיד עלה לגדולה, ושמר את הברכה במסגרת זהב.`],
[`מה מצאו החסידים באבטיח, ומה הבינו מהפתק?`,`פתק בכתב ידו של הרבי - והבינו שהוא חי`,[`מפתח לתא - והבינו שאפשר להבריח אותו`,`מכתב מהקיסר - והבינו שהוא משוחרר`],`עד אז לא ידע איש מהחסידים אם הרבי חי.`],
[`מי אני? בתוכי נמצא פתק ובו כתוב: "אני הוא האוכל... ואני נמצא במקום..."`,`כלי הדייסה`,[`האבטיח`,`ספר התניא`],`ר' מרדכי מליעפלי הכניס לאוכל פתק ושאל למי הוא מיועד, והרבי השיב לו על הפתק.`],
[`כמה ימים ישב האדמו"ר הזקן במאסר, וכנגד מה?`,`53, כנגד 53 פרקי תניא`,[`150, כנגד 150 פרקי תהילים`,`14, כנגד גימטריה חב"ד`],`53 ימים, כמניין הפרקים בחלק הראשון של ספר התניא.`],
[`באיזה תאריך השתחרר האדמו"ר הזקן ממאסר?`,`י"ט כסלו`,[`כ"ד טבת`,`י"ט שבט`],`י"ט כסלו תקנ"ט. בתאריך זה חל גם יום ההילולא של רבו, המגיד ממעזריטש.`],
[`ספר ידוע שכתב אדמו"ר הזקן:`,`תניא`,[`ליקוטי מוהר"ן`,`מסילת ישרים`],`ספר התניא מכונה "תורה שבכתב של החסידות".`],
[`השלימו: "תניא בסוף פרק ג' דנידה: משביעים אותו תהי ____ ואל תהי ____, ואפילו כל העולם כולו אומרים לך ____ אתה, היה בעיניך כ____"`,`צדיק, רשע, צדיק, רשע`,[`צדיק, רשע, צדיק, צדיק`,`חכם, רשע, חכם, צדיק`],`ההמשך: "וצריך להבין, דהא תנן ואל תהי רשע בפני עצמך, וגם אם יהיה בעיניו כרשע ירע לבבו ויהיה עצב, ולא יוכל לעבוד ה' בשמחה ובטוב לבב".`],
[`"פדה בשלום..." - כיצד ניגון זה קשור לגאולת אדמו"ר הזקן?`,`הרבי אמר את הפסוק הזה בתהילים כשבישרו לו שהוא משוחרר`,[`הסוהרים שרו אותו בשער הכלא`,`הפסוק היה כתוב על קירות התא`],`"פדה בשלום נפשי", תהילים פרק נ"ה.`],
[`מי היה האדם שלו זרק השר את האבטיח עם הפתק?`,`ר' ישראל, גיסו של הרבי`,[`ר' שמואל מונקס, החסיד שיעץ לרבי ללכת למאסר`,`ר' מרדכי, החסיד שהכין לרבי את האוכל`],`ר' ישראל קאזיק חיכה ליד בית השר, וראה אבטיח נופל מהחלון.`],
[`באיזה יום בשבוע חל י"ט כסלו, חג הגאולה?`,`ביום שלישי`,[`ביום ראשון`,`בשבת`],`הרבי השתחרר ביום שלישי, היום שבו הוכפל "כי טוב".`],

const CORNER='<path d="M3 27V9q0-6 6-6h18M8 22q0-14 14-14M8 14q6 0 6-6"/>',FLAME='<path d="M15 2q9 10 0 18q-9-8 0-18zM8 24h14M11 28h8"/>';
const svg=(p,c)=>'<svg class="'+c+'" viewBox="0 0 30 30" aria-hidden="true">'+p+'</svg>';
function draw(){
  const it=G.items[G.i],d=Q[it.i],done=it.pick!==null;
  $('score').textContent='✓ '+pts();$('time').textContent=clock();
  $('pos').textContent=(G.i+1)+' מתוך '+G.items.length;
  const T=$('teams');T.replaceChildren();
  if(G.mode==='teams')CL.forEach((n,k)=>T.append(el('span','team'+(k===it.k?' on':''),n+' · '+pts(k))));
  else if(G.mode==='one')T.append(el('span','tag',CL[it.k]));
  $('q').textContent=d[0];$('q').className=d[0].length>75?'long':'';
  const B=$('books');B.replaceChildren();
  it.opts.forEach((o,n)=>{
    const b=el('button','book');b.style.setProperty('--c',COLORS[n]);
    b.innerHTML=svg(CORNER,'cr')+svg(CORNER,'cl')+svg(FLAME,'flame');
    b.append(el('span','lbl',o));
    if(done){
      const g=o===d[1];b.disabled=true;
      b.classList.add(g?'good':n===it.pick?'wrong':'dim');
      if(g||n===it.pick)b.append(el('span','mark',g?'✓':'✕'));
    }
    b.onclick=()=>answer(n);B.append(b);
  });
  const F=$('fact');F.replaceChildren();
  if(done){
    const p=el('div','txt'),ok=right(it),nx=el('button','next',G.i+1<G.items.length?'לשאלה הבאה':'לתוצאות');
    p.append(el('b',ok?'ok':'no',ok?'מצוין! ':'אופס, שגוי. '),d[3]);
    nx.onclick=next;F.append(p,nx);nx.focus({preventScroll:true});
  }
  $('bPrev').disabled=G.i===0;$('bNext').disabled=!done;
  fit();
}
function fit(){
  document.querySelectorAll('.lbl').forEach(l=>{
    let s=innerWidth<=700?22:44;
    do{l.style.fontSize=s+'px';s-=1}while(s>12&&(l.scrollHeight>l.clientHeight+1||l.scrollWidth>l.clientWidth+1));
  });
}
function answer(n){const it=G.items[G.i];if(it.pick!==null)return;it.pick=n;right(it)?tone([523,659,784],'triangle'):tone([220,165],'sawtooth');draw()}
function next(){if(G.items[G.i].pick===null)return;if(G.i+1<G.items.length){G.i++;draw()}else finish()}
function finish(){
  clearInterval(tick);show('end');tone([523,659,784,1047],'triangle');
  const E=$('end');E.replaceChildren();E.scrollTop=0;
  let head='כל הכבוד!';
  if(G.mode==='teams'){
    const m=Math.max(...CL.map((_,k)=>pts(k))),w=CL.filter((_,k)=>pts(k)===m);
    head=m===0?'סוף החידון':w.length===1?w[0]+' ניצחה!':'תיקו!';
  }
  E.append(el('h2','',head));
  const r=el('div','res');
  [['תשובות נכונות',pts()+' / '+G.items.length],['זמן',clock()]].forEach(([a,b])=>{const s=el('div');s.append(el('b','',b),a);r.append(s)});
  E.append(r);
  if(G.mode==='teams'){
    const t=el('table'),h=el('tr');['כיתה','חלקי סיפור'].forEach(x=>h.append(el('th','',x)));t.append(h);
    CL.map((n,k)=>[n,pts(k)]).sort((a,b)=>b[1]-a[1]).forEach(([n,p])=>{const tr=el('tr');tr.append(el('td','',n),el('td','',p+' מתוך '+G.items.length/2));t.append(tr)});
    E.append(t);
  }
  const b=el('div','row'),A=el('button','next','משחק חוזר'),H=el('button','chip','לפתיחה');
  A.onclick=()=>start(G.mode,G.c);H.onclick=home;b.append(A,H);E.append(b);
  const ul=el('ol');ul.id='rev';
  G.items.forEach(it=>{const d=Q[it.i],li=el('li');li.append(el('div','',(it.i+1)+'. '+d[0]));if(!right(it))li.append(el('div','y','נבחר: '+it.opts[it.pick]));li.append(el('div','a',d[1]));ul.append(li)});
  E.append(ul);
}
function home(){clearInterval(tick);show('home');musicOff()}
$('mTeams').onclick=()=>start('teams');$('mAll').onclick=()=>start('all');
function names(){
  [0,1].forEach(k=>{CL[k]=$('n'+k).value.trim()||DEF[k]});
  $('pick').replaceChildren(...CL.map((n,k)=>{const b=el('button','chip',n);b.onclick=()=>start('one',k);return b}));
  try{localStorage.setItem('ytk-names',JSON.stringify(CL))}catch(e){}
}
[0,1].forEach(k=>$('n'+k).oninput=names);names();
$('bHome').onclick=home;$('bNext').onclick=next;$('bPrev').onclick=()=>{if(G.i){G.i--;draw()}};
songList();musicIcon();
$('bMus').onclick=()=>{mus=!mus;mus?musicOn():musicOff();musicIcon();try{localStorage.setItem('ytk-mus',mus?'1':'0')}catch(e){}};
$('bSnd').onclick=()=>{sound=!sound;$('bSnd').querySelector('.w').setAttribute('d',sound?'M16 9a4 4 0 0 1 0 6':'m16 9 6 6M22 9l-6 6');$('bSnd').setAttribute('aria-pressed',!sound)};
$('bFull').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{
  if($('game').hidden)return;
  const n=+e.key;
  if(n>=1&&n<=G.items[G.i].opts.length)answer(n-1);
  else if(e.key==='ArrowLeft')next();
  else if(e.key==='ArrowRight')$('bPrev').click();
});
function paint(){
  const c=$('bg'),w=c.width=innerWidth,h=c.height=innerHeight,x=c.getContext('2d');
  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
  x.fillStyle='#2a1628';x.fillRect(0,0,w,h);
  const H=Math.max(105,h/5.2),pal=['#5b2d46','#3f3a5e','#6d4a3c','#37505a','#70394a','#4b4668','#7a5a45'];
  for(let y=-H*.3;y<h;y+=H){
    for(let p=4;p<w;){
      const bw=12+R()*24,bh=H*(.52+R()*.3),by=y+H-14-bh;
      x.fillStyle=pal[R()*pal.length|0];x.fillRect(p,by,bw,bh);
      x.fillStyle='rgba(0,0,0,.28)';x.fillRect(p+bw-3,by,3,bh);
      x.fillStyle='rgba(240,207,138,.4)';x.fillRect(p+2,by+bh*.18,bw-6,2);x.fillRect(p+2,by+bh*.8,bw-6,2);
      p+=bw+(R()<.08?26:1);
    }
    x.fillStyle='#57334a';x.fillRect(0,y+H-14,w,14);x.fillStyle='rgba(255,255,255,.1)';x.fillRect(0,y+H-14,w,2);
  }
  for(let p=0;p<w;p+=Math.max(230,w/4)){x.fillStyle='#4a2a40';x.fillRect(p-9,0,18,h)}
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(34,14,38,.5)');g.addColorStop(.6,'rgba(28,10,30,.62)');g.addColorStop(1,'rgba(14,4,16,.96)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
}
addEventListener('resize',()=>{paint();fit()});paint();
if(document.fonts)document.fonts.ready.then(fit);
</script>
</body></html>
